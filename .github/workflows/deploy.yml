name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  # Barreira antes de publicar o robô: tipos e testes precisam passar.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

  deploy:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/torneios-xadrez/cron-import/cron-import:latest .

      - name: Push Docker image
        run: |
          docker push southamerica-east1-docker.pkg.dev/torneios-xadrez/cron-import/cron-import:latest

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update xadrez-br-cron \
            --image=southamerica-east1-docker.pkg.dev/torneios-xadrez/cron-import/cron-import:latest \
            --task-timeout=30m \
            --max-retries=0 \
            --region=southamerica-east1 \
            --project=torneios-xadrez
