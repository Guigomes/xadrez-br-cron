name: Build & Deploy

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker southamerica-east1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build -t southamerica-east1-docker.pkg.dev/torneios-xadrez/cron-import/cron-import:latest .

      - name: Push Docker image
        run: |
          docker push southamerica-east1-docker.pkg.dev/torneios-xadrez/cron-import/cron-import:latest

      - name: Update Cloud Run Job
        run: |
          gcloud run jobs update xadrez-br-cron \
            --image=southamerica-east1-docker.pkg.dev/torneios-xadrez/cron-import/cron-import:latest \
            --region=southamerica-east1 \
            --project=torneios-xadrez
